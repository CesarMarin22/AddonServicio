{% extends "menu.html" %} {% block title %} Ordenes de Trabajo - IPL {% endblock
%} {% block content %}
<div
  class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom"
>
  <button
    type="button"
    class="btn btn-dark d-lg-none me-2"
    data-toggle="modal"
    data-target="#sidebarModal"
  >
    <i class="fas fa-bars"></i>
  </button>
  <h1 class="h2 mb-0 flex-grow-1">Crear Orden de Trabajo</h1>
</div>

<div class="container mt-4">
  <form id="ordenTrabajoForm">
    <!-- Usuario de Creación de OT -->
    <div class="form-group">
      <label for="usuarioCreacion">Usuario de Creación de OT:</label>
      <input
        type="text"
        class="form-control"
        id="usuarioCreacion"
        name="usuarioCreacion"
        value="{{ session['username'] }}"
        readonly
      />
    </div>

    <!-- Serie -->
    <div class="form-group">
      <label for="serie">Serie:</label>
      <input
        type="text"
        class="form-control"
        value="{% if session['sucursal'] == '87' %}AGS{% 
        elif session['sucursal'] == '82' %}CLY{% 
        elif session['sucursal'] == '88' %}GDL{% 
        elif session['sucursal'] == '89' %}IRA{% 
        elif session['sucursal'] == '83' %}MEX{% 
        elif session['sucursal'] == '85' %}MTY{% 
        elif session['sucursal'] == '86' %}QRO{% 
        elif session['sucursal'] == '90' %}SLP{% 
        elif session['sucursal'] == '84' %}TOL{% 
        elif session['sucursal'] == '374' %}PUE{% 
        endif %}"
        readonly
      />
    </div>
    <!-- Oculto: valor real de la serie -->
    <input type="hidden" name="serie" value="{{ session['sucursal'] }}" />

    <!-- Folio y Folio Base -->
    <div class="form-group">
      <label for="folio">Folio:</label>
      <input
        type="number"
        class="form-control"
        id="folio"
        name="folio"
        min="0"
      />
    </div>

    <!--
    <div class="form-group">
      <label for="folioBase">Folio Base:</label>
      <input type="text" class="form-control" id="folioBase" name="folioBase" />
    </div> -->

    <!-- Fecha Inicio -->
    <div class="form-group">
      <label for="fechaInicio">Fecha Inicio:</label>
      <input
        type="text"
        class="form-control"
        id="fechaInicio"
        name="fechaInicio"
        placeholder="dd/mm"
        maxlength="5"
      />
    </div>

    <!-- Hora Inicio Trabajo -->
    <div class="form-group">
      <label for="horaInicioTrabajo">Hora Inicio Trabajo:</label>
      <input
        type="time"
        class="form-control"
        id="horaInicioTrabajo"
        name="horaInicioTrabajo"
      />
    </div>

    <!-- Tipo de Orden -->
    <div class="form-group">
      <label for="tipoOrden">Tipo de Orden:</label>
      <select class="form-control" id="tipoOrden" name="tipoOrden">
        <option value="1">Daños</option>
        <option value="2">Especial</option>
        <option value="3">Preventivo Equipo</option>
        <option value="15">Correctivo</option>
        <option value="18">Preventivo Bateria</option>
        <option value="19">Preventivo Cargador</option>
        <option value="20">Diagnostico</option>
      </select>
    </div>

    <!-- Tipo de Problema -->
    <div class="form-group position-relative">
      <label for="tipoProblema">Tipo de Problema (opcional) :</label>
      <select
        class="form-control tipo-problema-dropdown"
        id="tipoProblema"
        name="tipoProblema"
      >
        <!-- Las opciones serán cargadas dinámicamente -->
      </select>
    </div>

    <!-- Persona que Reporta -->
    <div class="form-group">
      <label for="personaReporta">Persona que Reporta:</label>
      <input
        type="text"
        class="form-control"
        id="personaReporta"
        name="personaReporta"
      />
    </div>

    <!-- Equipo en Funcionamiento -->
    <div class="form-group">
      <label>Equipo en Funcionamiento:</label><br />
      <input
        type="checkbox"
        id="equipoFuncionamientoSi"
        name="equipoFuncionamiento"
        value="1"
      />
      Sí
      <input
        type="checkbox"
        id="equipoFuncionamientoNo"
        name="equipoFuncionamiento"
        value="0"
      />
      No
    </div>

    <!-- Código de Cliente -->
    <div class="form-group position-relative">
      <label for="codigoCliente">Código de Cliente (Se puede buscar por numero, nombre o alias del cliente):</label>
      <input
        type="text"
        class="form-control"
        id="codigoCliente"
        name="codigoCliente"
        oninput="buscarClientes()"
        autocomplete="off"
      />
      <div
        id="dropdownClientes"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Nombre del Cliente -->
    <div class="form-group">
      <label for="nombreCliente">Nombre del Cliente:</label>
      <input
        type="text"
        class="form-control"
        id="nombreCliente"
        name="nombreCliente"
        readonly
      />
    </div>

    <!-- No de Serie -->
    <div class="form-group position-relative">
      <label for="noSerie">No de Serie (Se puede buscar por numero de serie, alias o modelo del equipo):</label>
      <input
        type="text"
        class="form-control"
        id="noSerie"
        name="noSerie"
        oninput="buscarEquiposConDebounce()"
        autocomplete="off"
      />
      <div
        id="dropdownEquipos"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Marca -->
    <div class="form-group position-relative">
      <label for="marca">Marca:</label>
      <input
        type="text"
        class="form-control"
        id="marca"
        name="marca"
        readonly
      />
    </div>

    <!-- Modelo -->
    <div class="form-group">
      <label for="modelo">Modelo:</label>
      <input
        type="text"
        class="form-control"
        id="modelo"
        name="modelo"
        readonly
      />
    </div>

    <!-- N° Económico -->
    <div class="form-group">
      <label for="noEconomico">Número Económico:</label>
      <input
        type="text"
        class="form-control"
        id="noEconomico"
        name="noEconomico"
        readonly
      />
    </div>

    <!-- Codigo de Articulo -->
    <div class="form-group">
      <label for="itemCode">Numero de Articulo:</label>
      <input
        type="text"
        class="form-control"
        id="itemCode"
        name="itemCode"
        readonly
      />
    </div>

    <!-- Horómetro -->
    <div class="form-group">
      <label for="horometro">Horómetro:</label>
      <input
        type="number"
        class="form-control"
        id="horometro"
        name="horometro"
        min="0"
      />
    </div>

    <!-- Descripción de la Falla -->
    <div class="form-group">
      <label for="descripcionFalla">Descripción de la Falla:</label>
      <textarea
        class="form-control"
        id="descripcionFalla"
        name="descripcionFalla"
        rows="4"
      ></textarea>
    </div>

    <!-- Trabajo Realizado -->
    <div class="form-group">
      <label for="trabajoRealizado">Trabajo Realizado:</label>
      <textarea
        class="form-control"
        id="trabajoRealizado"
        name="trabajoRealizado"
        rows="4"
      ></textarea>
    </div>

    <!-- Refacciones -->
    <div class="form-group">
      <label>Refacciones:</label><br />
      <input
        type="checkbox"
        id="refaccionesInstaladas"
        value="1"
        name="tipoRefacciones"
        onclick="habilitarRefacciones()"
        checked
      />
      Instaladas
      <input
        type="checkbox"
        id="refaccionesRequeridas"
        value="0"
        name="tipoRefacciones"
        onclick="habilitarRefacciones()"
      />
      Requeridas
      <input
        type="checkbox"
        id="refaccionesAmbas"
        value="2"
        name="tipoRefacciones"
        onclick="habilitarRefacciones()"
      />
      Ambas
    </div>

    <!-- Contenedor para el título dinámico -->
    <h5 id="refaccionesTitulo" class="mt-3">Refacciones Instaladas</h5>

    <div id="refaccionesContainer">
      {% for i in range(20) %}
      <div class="form-group position-relative refaccion-item">
        <input
          type="number"
          class="form-control d-inline refaccion"
          name="cantidad_{{ i }}"
          placeholder="Cantidad"
          style="width: 10%"
          min="0"
        />
        <input
          type="text"
          class="form-control d-inline refaccion item-code"
          name="numeroParte_{{ i }}"
          placeholder="Número de Parte"
          style="width: 30%"
          oninput="buscarItemConDebounce(this, '{{ i }}')"
          autocomplete="off"
        />
        <div
          id="dropdownItems{{ i }}"
          class="dropdown-menu"
          style="display: none; position: absolute; z-index: 1000; width: 100%"
        ></div>
        <input
          type="text"
          class="form-control d-inline refaccion item-name"
          name="descripcion_{{ i }}"
          placeholder="Descripción"
          style="width: 55%"
          readonly
        />
      </div>
      {% endfor %}
    </div>

    <!-- Dropdown para mostrar sugerencias de Número de Parte -->
    <div
      id="dropdownItems"
      class="dropdown-menu"
      style="display: none; position: absolute; z-index: 1000; width: 100%"
    ></div>

    <!-- Fecha de Término -->
    <div class="form-group">
      <label for="fechaTermino">Fecha de Término:</label>
      <input
        type="text"
        class="form-control"
        id="fechaTermino"
        name="fechaTermino"
        placeholder="dd/mm"
        maxlength="5"
      />
    </div>

    <!-- Hora de Salida -->
    <div class="form-group">
      <label for="horaSalida">Hora de Salida:</label>
      <input
        type="time"
        class="form-control"
        id="horaSalida"
        name="horaSalida"
      />
    </div>

    <!-- Realizó Trabajo -->
    <div class="form-group position-relative">
      <label for="realizoTrabajo">Realizó Trabajo:</label>
      <input
        type="text"
        class="form-control"
        id="realizoTrabajo"
        oninput="buscarEmpleadoConDebounce('realizoTrabajo')"
        autocomplete="off"
      />
      <input
        type="hidden"
        id="realizoTrabajoEmployeeID"
        name="realizoTrabajoEmployeeID"
      />
      <input
        type="hidden"
        id="realizoTrabajoRoleID"
        name="realizoTrabajoRoleID"
      />
      <!-- Campo oculto para EmployeeID -->
      <div
        id="dropdownRealizoTrabajo"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Técnico 3 -->
    <div class="form-group position-relative">
      <label for="tecnico3">Técnico 2 (opcional):</label>
      <input
        type="text"
        class="form-control"
        id="tecnico3"
        name="tecnico3"
        oninput="buscarEmpleadoConDebounce('tecnico3')"
        autocomplete="off"
      />
      <input type="hidden" id="tecnico3EmployeeID" name="tecnico3EmployeeID" />
      <div
        id="dropdownTecnico3"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Técnico 4 -->
    <div class="form-group position-relative">
      <label for="tecnico4">Técnico 3 (opcional):</label>
      <input
        type="text"
        class="form-control"
        id="tecnico4"
        name="tecnico4"
        oninput="buscarEmpleadoConDebounce('tecnico4')"
        autocomplete="off"
      />
      <input type="hidden" id="tecnico4EmployeeID" name="tecnico4EmployeeID" />
      <div
        id="dropdownTecnico4"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Nombre de CSSR -->
    <div class="form-group position-relative">
      <label for="nombreCssr">Nombre de REV:</label>
      <input
        type="text"
        class="form-control"
        id="nombreCssr"
        name="nombreCssr"
        oninput="buscarCssrsConDebounce('nombreCssr')"
        autocomplete="off"
      />
      <input
        type="hidden"
        id="nombreCssrEmployeeID"
        name="nombreCssrEmployeeID"
      />
      <!-- Campo oculto para EmployeeID -->
      <div
        id="dropdownNombreCssr"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Revisó Trabajo -->
    <div class="form-group position-relative">
      <label for="revisoTrabajo">Revisó Trabajo (opcional):</label>
      <input
        type="text"
        class="form-control"
        id="revisoTrabajo"
        name="revisoTrabajo"
        oninput="buscarEmpleadoConDebounce('revisoTrabajo')"
        autocomplete="off"
      />
      <input
        type="hidden"
        id="revisoTrabajoEmployeeID"
        name="revisoTrabajoEmployeeID"
      />
      <!-- Campo oculto para EmployeeID -->
      <div
        id="dropdownRevisoTrabajo"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Visto Bueno del Cliente -->
    <div class="form-group">
      <label for="vistoBuenoCliente">Visto Bueno del Cliente:</label>
      <input
        type="text"
        class="form-control"
        id="vistoBuenoCliente"
        name="vistoBuenoCliente"
      />
    </div>
    <!-- Resto del formulario -->
    <button type="submit" id="guardarButton" class="btn btn-primary">
      Guardar
    </button>
    <button type="button" id="imprimirButton" class="btn btn-secondary ms-2">
      Imprimir
    </button>
  </form>
</div>
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

{% endblock %}
