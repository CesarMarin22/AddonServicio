{% extends "menu.html" %}
{% block title %} Crear OT Seguridad - IPL {% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
  <button type="button" class="btn btn-dark d-lg-none me-2" data-toggle="modal" data-target="#sidebarModal">
    <i class="fas fa-bars"></i>
  </button>
  <h1 class="h2 mb-0 flex-grow-1">Crear OT Seguridad</h1>
</div>

<div class="container mt-4">
  <form id="ordenTrabajoSeguridadForm">
    <!-- Usuario -->
    <div class="form-group">
      <label for="usuarioCreacion">Usuario:</label>
      <input type="text" class="form-control" id="usuarioCreacion" name="usuarioCreacion" value="{{ session['username'] }}" readonly />
    </div>

    <!-- Serie (sucursal traducida) -->
    <div class="form-group">
      <label for="serie">Serie:</label>
      <input type="text" class="form-control" value="{% if session['sucursal'] == '87' %}AGS{% 
        elif session['sucursal'] == '82' %}CLY{% 
        elif session['sucursal'] == '88' %}GDL{% 
        elif session['sucursal'] == '89' %}IRA{% 
        elif session['sucursal'] == '83' %}MEX{% 
        elif session['sucursal'] == '85' %}MTY{% 
        elif session['sucursal'] == '86' %}QRO{% 
        elif session['sucursal'] == '90' %}SLP{% 
        elif session['sucursal'] == '84' %}TOL{% 
        elif session['sucursal'] == '374' %}PUE{% 
        endif %}" readonly />
    </div>
    <input type="hidden" name="serie" value="{{ session['sucursal'] }}" />

    <!-- Folio -->
    <div class="form-group">
      <label for="folio">Folio:</label>
      <input type="number" class="form-control" id="folio" name="folio" min="0" />
    </div>

    <!-- Fecha Inicio -->
    <div class="form-group">
      <label for="fechaInicio">Fecha Inicio:</label>
      <input type="text" class="form-control" id="fechaInicio" name="fechaInicio" placeholder="dd/mm" maxlength="5" />
    </div>

    <!-- Hora de Inicio -->
    <div class="form-group">
      <label for="horaInicioTrabajo">Hora Inicio Trabajo:</label>
      <input type="time" class="form-control" id="horaInicioTrabajo" name="horaInicioTrabajo" />
    </div>

    <!-- Persona que Reporta -->
    <div class="form-group">
      <label for="personaReporta">Persona que Reporta:</label>
      <input type="text" class="form-control" id="personaReporta" name="personaReporta" />
    </div>

    <!-- Código Cliente -->
    <div class="form-group position-relative">
      <label for="codigoCliente">Código de Cliente:</label>
      <input type="text" class="form-control" id="codigoCliente" name="codigoCliente" oninput="buscarClientes()" autocomplete="off" />
      <div id="dropdownClientes" class="dropdown-menu" style="display: none; position: absolute; z-index: 1000; width: 100%"></div>
    </div>

    <!-- Nombre Cliente -->
    <div class="form-group">
      <label for="nombreCliente">Nombre del Cliente:</label>
      <input type="text" class="form-control" id="nombreCliente" name="nombreCliente" readonly />
    </div>

    <!-- Número de Serie -->
    <div class="form-group position-relative">
      <label for="noSerie">No de Serie:</label>
      <input type="text" class="form-control" id="noSerie" name="noSerie" oninput="buscarEquiposConDebounce()" autocomplete="off" />
      <div id="dropdownEquipos" class="dropdown-menu" style="display: none; position: absolute; z-index: 1000; width: 100%"></div>
    </div>

    <!-- Marca -->
    <div class="form-group">
      <label for="marca">Marca:</label>
      <input type="text" class="form-control" id="marca" name="marca" readonly />
    </div>

    <!-- Modelo -->
    <div class="form-group">
      <label for="modelo">Modelo:</label>
      <input type="text" class="form-control" id="modelo" name="modelo" readonly />
    </div>

    <!-- Número Económico -->
    <div class="form-group">
      <label for="noEconomico">Número Económico:</label>
      <input type="text" class="form-control" id="noEconomico" name="noEconomico" readonly />
    </div>

    <!-- Descripción del Incidente -->
    <div class="form-group">
      <label for="descripcionFalla">Descripción del Incidente:</label>
      <textarea class="form-control" id="descripcionFalla" name="descripcionFalla" rows="4"></textarea>
    </div>

    <!-- Realizó Trabajo -->
    <div class="form-group position-relative">
      <label for="realizoTrabajo">Realizó Trabajo:</label>
      <input type="text" class="form-control" id="realizoTrabajo" oninput="buscarEmpleadoConDebounce('realizoTrabajo')" autocomplete="off" />
      <input type="hidden" id="realizoTrabajoEmployeeID" name="realizoTrabajoEmployeeID" />
      <input type="hidden" id="realizoTrabajoRoleID" name="realizoTrabajoRoleID" />
      <div id="dropdownRealizoTrabajo" class="dropdown-menu" style="display: none; position: absolute; z-index: 1000; width: 100%"></div>
    </div>

    <!-- Fecha de Término -->
    <div class="form-group">
      <label for="fechaTermino">Fecha de Término:</label>
      <input type="text" class="form-control" id="fechaTermino" name="fechaTermino" placeholder="dd/mm" maxlength="5" />
    </div>

    <!-- Hora de Salida -->
    <div class="form-group">
      <label for="horaSalida">Hora de Salida:</label>
      <input type="time" class="form-control" id="horaSalida" name="horaSalida" />
    </div>

    <!-- Visto Bueno Cliente -->
    <div class="form-group">
      <label for="vistoBuenoCliente">Visto Bueno del Cliente:</label>
      <input type="text" class="form-control" id="vistoBuenoCliente" name="vistoBuenoCliente" />
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
</div>

{% endblock %}
