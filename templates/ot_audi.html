{% extends "menu.html" %} {% block title %} Ordenes de Trabajo - IPL {% endblock
%} {% block content %}
<div
  class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom"
>
  <button
    type="button"
    class="btn btn-dark d-lg-none me-2"
    data-toggle="modal"
    data-target="#sidebarModal"
  >
    <i class="fas fa-bars"></i>
  </button>
  <h1 class="h2 mb-0 flex-grow-1">Crear Orden de Trabajo AUDI</h1>
</div>

<div class="container mt-4">
  <form
    id="ordenTrabajoForm"
    data-tipo="audi"
    method="post"
    action="javascript:void(0);"
  >
    <!-- Usuario de Creación de OT -->
    <div class="form-group">
      <label for="usuarioCreacion">Usuario de Creación de OT:</label>
      <input
        type="text"
        class="form-control"
        id="usuarioCreacion"
        name="usuarioCreacion"
        value="{{ session['username'] }}"
        readonly
      />
    </div>

    <!-- Serie -->
    <div class="form-group">
      <label for="serie">Serie:</label>
      <input type="text" class="form-control" value="PUE" readonly />
      <input type="hidden" name="serie" value="374" />
    </div>

    <!-- Tipo de Orden -->
    <div class="form-group">
      <label>¿Qué tipo de orden es?</label><br />

      <input type="radio" id="ordenAviso" name="ordenBase" value="B" checked />
      <label for="ordenAviso">Aviso</label>

      <input type="radio" id="ordenReporte" name="ordenBase" value="N" />
      <label for="ordenReporte">Reporte de Trabajo</label>
    </div>

    <!-- OT Base (solo visible si es Notificación) 
    <div class="form-group" id="otBaseContainer" style="display: none">
      <label for="otBase">Número de OT Base:</label>
      <input
        type="number"
        class="form-control"
        id="otBase"
        name="otBase"
        min="0"
      />
    </div> -->

    <!-- Folio IPL (solo visible si es Notificación) -->
    <div class="form-group" id="folioContainer" style="display: none">
      <label for="folio">Folio Fisico:</label>
      <input
        type="number"
        class="form-control"
        id="folio"
        name="folio"
        min="0"
      />
    </div>

    <div class="form-group">
      <label for="folioEx">Numero de Aviso:</label>
      <input
        type="number"
        class="form-control"
        id="folioEx"
        name="folioEx"
        min="0"
      />
    </div>

    <!-- Fecha Inicio (reutilizada como fecha de inicio o de llegada) -->
    <div class="form-group">
      <label id="labelFechaInicio" for="fechaInicio"
        >Fecha Inicio de Trabajo:</label
      >
      <input
        type="text"
        class="form-control"
        id="fechaInicio"
        name="fechaInicio"
        placeholder="dd/mm"
        maxlength="5"
      />
    </div>

    <!-- Hora Inicio (reutilizada como hora de inicio o de llegada) -->
    <div class="form-group">
      <label id="labelHoraInicio" for="horaInicioTrabajo"
        >Hora Inicio de Trabajo:</label
      >
      <input
        type="time"
        class="form-control"
        id="horaInicioTrabajo"
        name="horaInicioTrabajo"
      />
    </div>

    <!-- Tipo de Orden -->
    <div class="form-group" id="tipoOrdenContainer">
      <label for="tipoOrdenAudi">Tipo de Orden:</label>
      <select class="form-control" id="tipoOrdenAudi" name="U_A_Orden">
        <option value="" disabled selected>Seleccione un tipo de orden</option>
        <option value="ZPM2" data-calltype="3">Preventivo</option>
        <option value="ZPM3" data-calltype="15">Correctivo</option>
        <option value="ZPM8" data-calltype="2">Ajustes</option>
      </select>
      <!-- Campo oculto para guardar el callType -->
      <input type="hidden" id="callType" name="callType" />
    </div>

    <div id="defectosSection">
      <!-- Tipo de Defecto -->
      <div class="form-group position-relative">
        <label for="tipoProblema">Defecto:</label>
        <select class="form-control" id="tipoProblema" name="tipoProblema">
          <option value="">Seleccione un defecto</option>
        </select>
      </div>

      <!-- Causas -->
      <div class="form-group position-relative">
        <label for="causa">Causas:</label>
        <select class="form-control" id="causa" name="causa">
          <option value="">Seleccione una causa</option>
        </select>
      </div>

      <!-- Tipo de Daño -->
      <div class="form-group position-relative">
        <label for="tipoDanio">Tipo de Daño:</label>
        <select class="form-control" id="tipoDanio" name="tipoDanio">
          <option value="">Seleccione un tipo de daño</option>
        </select>
      </div>
    </div>

    <!-- Persona que Reporta -->
    <div class="form-group">
      <label for="personaReporta">Persona que Reporta:</label>
      <input
        type="text"
        class="form-control"
        id="personaReporta"
        name="personaReporta"
      />
    </div>

    <!-- Equipo en Funcionamiento -->
    <div class="form-group">
      <label>Equipo en Funcionamiento:</label><br />
      <input
        type="checkbox"
        id="equipoFuncionamientoSi"
        name="equipoFuncionamiento"
        value="1"
      />
      Sí
      <input
        type="checkbox"
        id="equipoFuncionamientoNo"
        name="equipoFuncionamiento"
        value="0"
      />
      No
    </div>

    <!-- Código de Cliente -->
    <div class="form-group position-relative">
      <label for="codigoCliente">Código de Cliente:</label>
      <input
        type="text"
        class="form-control"
        id="codigoCliente"
        name="codigoCliente"
        value="C00133"
        readonly
      />
    </div>

    <!-- Nombre del Cliente -->
    <div class="form-group">
      <label for="nombreCliente">Nombre del Cliente:</label>
      <input
        type="text"
        class="form-control"
        id="nombreCliente"
        name="nombreCliente"
        value="AUDI MEXICO"
        readonly
      />
    </div>

    <!-- No de Serie -->
    <div class="form-group position-relative">
      <label for="noSerie">No de Serie:</label>
      <input
        type="text"
        class="form-control"
        id="noSerie"
        name="noSerie"
        oninput="buscarEquiposConDebounce()"
        autocomplete="off"
      />
      <div
        id="dropdownEquipos"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Marca -->
    <div class="form-group position-relative">
      <label for="marca">Marca:</label>
      <input
        type="text"
        class="form-control"
        id="marca"
        name="marca"
        readonly
      />
    </div>

    <!-- Modelo -->
    <div class="form-group">
      <label for="modelo">Modelo:</label>
      <input
        type="text"
        class="form-control"
        id="modelo"
        name="modelo"
        readonly
      />
    </div>

    <!-- N° Económico -->
    <div class="form-group">
      <label for="noEconomico">Número Económico:</label>
      <input
        type="text"
        class="form-control"
        id="noEconomico"
        name="noEconomico"
        readonly
      />
    </div>

    <!-- Codigo de Articulo -->
    <div class="form-group">
      <label for="itemCode">Numero de Articulo:</label>
      <input
        type="text"
        class="form-control"
        id="itemCode"
        name="itemCode"
        readonly
      />
    </div>

    <!-- Horómetro -->
    <div class="form-group">
      <label for="horometro">Horómetro:</label>
      <input
        type="number"
        class="form-control"
        id="horometro"
        name="horometro"
        min="0"
      />
    </div>

    <!-- Descripción de la Falla -->
    <div class="form-group">
      <label for="descripcionFalla">Descripción de la Falla:</label>
      <textarea
        class="form-control"
        id="descripcionFalla"
        name="descripcionFalla"
        rows="4"
      ></textarea>
    </div>

    <!-- Trabajo Realizado -->
    <div class="form-group">
      <label for="trabajoRealizado">Trabajo Realizado:</label>
      <textarea
        class="form-control"
        id="trabajoRealizado"
        name="trabajoRealizado"
        rows="4"
      ></textarea>
    </div>

    <!-- Refacciones -->
    <!-- 🔧 INICIO bloque de refacciones -->
    <div id="refaccionesSection">
      <!-- Refacciones -->
      <div class="form-group">
        <label>Refacciones:</label><br />
        <input
          type="checkbox"
          id="refaccionesInstaladas"
          value="1"
          name="tipoRefacciones"
          onclick="habilitarRefacciones()"
          checked
        />
        Instaladas
        <input
          type="checkbox"
          id="refaccionesRequeridas"
          value="0"
          name="tipoRefacciones"
          onclick="habilitarRefacciones()"
        />
        Requeridas
        <input
          type="checkbox"
          id="refaccionesAmbas"
          value="2"
          name="tipoRefacciones"
          onclick="habilitarRefacciones()"
        />
        Ambas
      </div>

      <!-- Contenedor para el título dinámico -->
      <h5 id="refaccionesTitulo" class="mt-3">Refacciones Instaladas</h5>

      <div id="refaccionesContainer">
        {% for i in range(20) %}
        <div class="form-group position-relative refaccion-item">
          <input
            type="number"
            class="form-control d-inline refaccion"
            name="cantidad_{{ i }}"
            placeholder="Cantidad"
            style="width: 10%"
            min="0"
          />
          <input
            type="text"
            class="form-control d-inline refaccion item-code"
            name="numeroParte_{{ i }}"
            placeholder="Número de Parte"
            style="width: 30%"
            oninput="buscarItemConDebounce(this, '{{ i }}')"
            autocomplete="off"
          />
          <div
            id="dropdownItems{{ i }}"
            class="dropdown-menu"
            style="
              display: none;
              position: absolute;
              z-index: 1000;
              width: 100%;
            "
          ></div>
          <input
            type="text"
            class="form-control d-inline refaccion item-name"
            name="descripcion_{{ i }}"
            placeholder="Descripción"
            style="width: 55%"
            readonly
          />
        </div>
        {% endfor %}
      </div>
    </div>
    <!-- 🔧 FIN bloque de refacciones -->

    <!-- Dropdown para mostrar sugerencias de Número de Parte -->
    <div
      id="dropdownItems"
      class="dropdown-menu"
      style="display: none; position: absolute; z-index: 1000; width: 100%"
    ></div>

    <!--Numero de Personas-->
    <div class="form-group">
      <label for="NumPersonas">Numero de Personas que Trabajaron</label>
      <input
        type="number"
        class="form-control"
        id="NumPersonas"
        name="NumPersonas"
        min="0"
      />
    </div>

    <!-- Horas trabajadas  -->
    <div class="form-group">
      <label for="horasTrabajadas">Horas Trabajadas:</label>
      <input
        type="number"
        step="0.5"
        class="form-control"
        id="horasTrabajadas"
        name="horasTrabajadas"
      />
    </div>

    <!-- Fecha de Término -->
    <div class="form-group" id="fechaTerminoContainer">
      <label for="fechaTermino">Fecha de Término de Trabajo:</label>
      <input
        type="text"
        class="form-control"
        id="fechaTermino"
        name="fechaTermino"
        placeholder="dd/mm"
        maxlength="5"
        readonly
      />
    </div>

    <!-- Hora de Salida -->
    <div class="form-group" id="horaSalidaContainer">
      <label for="horaSalida">Hora de término de Trabajo:</label>
      <input
        type="time"
        class="form-control"
        id="horaSalida"
        name="horaSalida"
        readonly
      />
    </div>

    <!-- Realizó Trabajo -->
    <div class="form-group position-relative">
      <label for="realizoTrabajo">Realizó Trabajo:</label>
      <input
        type="text"
        class="form-control"
        id="realizoTrabajo"
        oninput="buscarEmpleadoConDebounce('realizoTrabajo')"
        autocomplete="off"
      />
      <input
        type="hidden"
        id="realizoTrabajoEmployeeID"
        name="realizoTrabajoEmployeeID"
      />
      <input
        type="hidden"
        id="realizoTrabajoRoleID"
        name="realizoTrabajoRoleID"
      />
      <!-- Campo oculto para EmployeeID -->
      <div
        id="dropdownRealizoTrabajo"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Técnico 3 -->
    <div class="form-group position-relative">
      <label for="tecnico3">Técnico 2 (opcional):</label>
      <input
        type="text"
        class="form-control"
        id="tecnico3"
        name="tecnico3"
        oninput="buscarEmpleadoConDebounce('tecnico3')"
        autocomplete="off"
      />
      <input type="hidden" id="tecnico3EmployeeID" name="tecnico3EmployeeID" />
      <div
        id="dropdownTecnico3"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Técnico 4 -->
    <div class="form-group position-relative">
      <label for="tecnico4">Técnico 3 (opcional):</label>
      <input
        type="text"
        class="form-control"
        id="tecnico4"
        name="tecnico4"
        oninput="buscarEmpleadoConDebounce('tecnico4')"
        autocomplete="off"
      />
      <input type="hidden" id="tecnico4EmployeeID" name="tecnico4EmployeeID" />
      <div
        id="dropdownTecnico4"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Nombre de CSSR -->
    <div class="form-group position-relative">
      <label for="nombreCssr">Nombre de REV:</label>
      <input
        type="text"
        class="form-control"
        id="nombreCssr"
        name="nombreCssr"
        oninput="buscarCssrsConDebounce('nombreCssr')"
        autocomplete="off"
      />
      <input
        type="hidden"
        id="nombreCssrEmployeeID"
        name="nombreCssrEmployeeID"
      />
      <!-- Campo oculto para EmployeeID -->
      <div
        id="dropdownNombreCssr"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Revisó Trabajo -->
    <div class="form-group position-relative">
      <label for="revisoTrabajo">Revisó Trabajo (opcional):</label>
      <input
        type="text"
        class="form-control"
        id="revisoTrabajo"
        name="revisoTrabajo"
        oninput="buscarEmpleadoConDebounce('revisoTrabajo')"
        autocomplete="off"
      />
      <input
        type="hidden"
        id="revisoTrabajoEmployeeID"
        name="revisoTrabajoEmployeeID"
      />
      <!-- Campo oculto para EmployeeID -->
      <div
        id="dropdownRevisoTrabajo"
        class="dropdown-menu"
        style="display: none; position: absolute; z-index: 1000; width: 100%"
      ></div>
    </div>

    <!-- Visto Bueno del Cliente -->
    <div class="form-group">
      <label for="vistoBuenoCliente">Visto Bueno del Cliente:</label>
      <input
        type="text"
        class="form-control"
        id="vistoBuenoCliente"
        name="vistoBuenoCliente"
        value="Ing Martin Barrios"
        readonly
      />
    </div>
    <!-- Resto del formulario -->
    <button type="submit" id="guardarButton" class="btn btn-primary">
      Guardar
    </button>
    <button type="button" id="imprimirButton" class="btn btn-secondary ms-2">
      Imprimir
    </button>
  </form>
</div>
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% endblock %}
